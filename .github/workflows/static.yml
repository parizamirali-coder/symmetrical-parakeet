name: Validate and deploy student score website

on:
  push:
    branches:
      - main
    # CSV-only commits must not rebuild/redeploy GitHub Pages.
    paths-ignore:
      - "scores.csv"
      - "students.csv"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate-website:
    name: Validate website files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required website files
        run: |
          test -f index.html
          test -f student.html
          test -f styles.css
          test -f student.js

  deploy:
    name: Publish GitHub Pages
    needs: validate-website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble the website
        run: |
          mkdir -p _site
          cp index.html student.html styles.css student.js _site/
          # The student page reads scores.csv and students.csv directly from GitHub.
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
